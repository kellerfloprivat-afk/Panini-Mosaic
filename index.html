<style>
  :root{
    --court:#15181f;
    --panel:#1d212b;
    --panel-hi:#262b37;
    --line:#2e3441;
    --ink:#eef0f4;
    --ink-dim:#8b93a3;
    --gold:#e8b64a;
    --gold-dim:#4a3f24;
    --net:#3fae8a;
    --net-dim:#16332a;
    --danger:#d9694f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--court);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--court) 70%, rgba(21,24,31,0));
    padding:16px 16px 10px;
  }
  .eyebrow{font-size:12px; color:var(--ink-dim); letter-spacing:.02em; margin:0 0 2px;}
  h1{font-size:20px; margin:0 0 12px; font-weight:800; letter-spacing:-.01em;}
  h1 span.num{color:var(--gold);}

  .set-tabs{
    display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px;
    scrollbar-width:none;
  }
  .set-tabs::-webkit-scrollbar{display:none;}
  .set-tab{
    flex:0 0 auto; background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:9px 12px; text-align:center; color:var(--ink-dim); font-size:11.5px; font-weight:600;
    line-height:1.25; white-space:nowrap;
  }
  .set-tab .season{display:block; font-size:12.5px; font-weight:800; color:var(--ink);}
  .set-tab.active{background:var(--gold-dim); border-color:var(--gold);}
  .set-tab.active, .set-tab.active .season{color:var(--gold);}

  .progress-wrap{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:10px;
  }
  .progress-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .progress-top .count{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums;}
  .progress-top .count small{font-size:13px; font-weight:500; color:var(--ink-dim);}
  .progress-top .pct{font-size:13px; color:var(--gold); font-weight:700;}
  .bar{height:8px; border-radius:5px; background:var(--panel-hi); overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--net), var(--gold)); width:0%; transition:width .35s ease;}

  .search-row{display:flex; gap:8px; margin-bottom:10px;}
  .search{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; color:var(--ink); font-size:15px;
  }
  .search::placeholder{color:var(--ink-dim);}

  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; font-size:12.5px; padding:7px 12px; border-radius:20px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
  }
  .chip.active{background:var(--gold-dim); border-color:var(--gold); color:var(--gold); font-weight:700;}

  main{padding:4px 16px 0;}

  .section{margin-top:18px;}
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 2px 8px; position:sticky; top:198px; z-index:5;
    background:var(--court);
  }
  .section-head h2{font-size:15px; margin:0; font-weight:700; color:var(--ink);}
  .section-head .stat{font-size:12.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums;}

  .card-list{display:flex; flex-direction:column; gap:6px;}
  .card-row{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; cursor:pointer; user-select:none;
    transition:background .15s ease, border-color .15s ease;
  }
  .card-row:active{background:var(--panel-hi);}
  .card-row.collected{background:var(--net-dim); border-color:#2a5a48;}
  .box{
    flex:0 0 26px; width:26px; height:26px; border-radius:8px;
    border:2px solid var(--ink-dim); display:flex; align-items:center; justify-content:center;
    font-size:15px; color:transparent; font-weight:800; transition:all .15s ease;
  }
  .card-row.collected .box{background:var(--net); border-color:var(--net); color:var(--court);}
  .num-badge{
    flex:0 0 auto; min-width:34px; text-align:right;
    font-size:13px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums;
  }
  .card-row.collected .num-badge{color:#7fd4b6;}
  .card-info{flex:1; min-width:0;}
  .card-name{font-size:14.5px; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-team{font-size:12px; color:var(--ink-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-row.collected .card-team{color:#6ea590;}
  .parallel-tag{
    font-size:10.5px; color:var(--gold); margin-top:2px; font-weight:600;
  }
  .edit-tag-btn{
    flex:0 0 auto; width:26px; height:26px; border-radius:8px;
    background:var(--panel-hi); border:1px solid var(--line); color:var(--ink-dim);
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .edit-tag-btn:active{border-color:var(--gold); color:var(--gold);}

  .empty{text-align:center; padding:50px 20px; color:var(--ink-dim); font-size:14px;}

  .reset-wrap{padding:26px 16px 0; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center;}
  .backup-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .backup-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
    font-size:12.5px; padding:9px 16px; border-radius:10px;
  }
  .backup-btn:active{border-color:var(--gold); color:var(--gold);}
  .backup-note{font-size:11.5px; color:var(--ink-dim); max-width:280px; line-height:1.4;}
  .reset-btn{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-size:13px; padding:9px 18px; border-radius:10px;
  }
  .reset-btn:active{border-color:var(--danger); color:var(--danger);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-hi); border:1px solid var(--line); color:var(--ink);
    padding:10px 18px; border-radius:10px; font-size:13px; opacity:0;
    transition:all .25s ease; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

<header>
  <p class="eyebrow">Panini Mosaic Basketball</p>
  <h1>Meine <span class="num">Sammlung</span></h1>
  <p class="eyebrow" id="syncStatus" style="margin-bottom:10px;"></p>

  <div class="set-tabs" id="setTabs"></div>

  <div class="progress-wrap">
    <div class="progress-top">
      <div class="count"><span id="collectedCount">0</span><small> / <span id="totalCount">0</span> Karten</small></div>
      <div class="pct" id="pctLabel">0%</div>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <div class="search-row">
    <input class="search" id="searchInput" type="text" placeholder="Spieler oder Team suchen …">
  </div>
  <div class="chips" id="chipRow"></div>
</header>

<main id="mainContent"></main>

<div class="reset-wrap">
  <div class="backup-row">
    <button class="backup-btn" id="refreshBtn">🔄 Aktualisieren</button>
    <button class="backup-btn" id="pdfBtn">📄 Als PDF</button>
  </div>
  <button class="reset-btn" id="resetBtn">Diese Liste zurücksetzen</button>
</div>

<div class="toast" id="toast"></div>

let activeCollectionIdx = 0;
let activeSection = 'all';
let searchTerm = '';
let collected = {}; // { "cardNum": "Parallele" } - leerer String = besitze Karte, keine Parallele notiert

function currentCollection(){ return COLLECTIONS[activeCollectionIdx]; }

function normalizeCollected(raw){
  // Rückwärtskompatibilität: alte Daten waren ein Array von Nummern
  if(Array.isArray(raw)){
    const obj = {};
    raw.forEach(n => obj[n] = '');
    return obj;
  }
  return raw || {};
}

async function loadCollection(){
  const c = currentCollection();
  collected = {};

  if(firebaseReady){
    try{
      const snap = await db.ref('collections/' + c.storageKey).once('value');
      const val = snap.val();
      if(val){
        collected = normalizeCollected(JSON.parse(val));
      }
      // lokale Kopie als Offline-Fallback aktuell halten
      localStorage.setItem(c.storageKey, JSON.stringify(collected));
    }catch(e){
      console.error('Firebase-Laden fehlgeschlagen, nutze lokale Kopie', e);
      loadFromLocalStorage(c);
    }
  }else{
    loadFromLocalStorage(c);
  }

  activeSection = 'all';
  searchTerm = '';
  document.getElementById('searchInput').value = '';
  render();
}

function loadFromLocalStorage(c){
  try{
    const raw = localStorage.getItem(c.storageKey);
    if(raw){
      collected = normalizeCollected(JSON.parse(raw));
    }
  }catch(e){}
}

async function saveCollection(){
  const c = currentCollection();

  try{
    localStorage.setItem(c.storageKey, JSON.stringify(collected));
  }catch(e){}

  if(firebaseReady){
    try{
      await db.ref('collections/' + c.storageKey).set(JSON.stringify(collected));
    }catch(e){
      showToast('Sync fehlgeschlagen (offline gespeichert)');
    }
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 1400);
}

function toggleCard(num){
  const key = String(num);
  if(key in collected){
    delete collected[key];
  }else{
    collected[key] = '';
    showToast('In der Sammlung ✓');
  }
  saveCollection();
  render();
}

function editParallel(num){
  const key = String(num);
  const current = collected[key] || '';
  const input = prompt('Welche Parallele hast du? (z.B. "Green Mosaic", leer lassen für Standard)', current);
  if(input === null) return; // abgebrochen
  collected[key] = input.trim();
  saveCollection();
  render();
}



function buildSetTabs(){
  const wrap = document.getElementById('setTabs');
  wrap.innerHTML = '';
  COLLECTIONS.forEach((c, idx)=>{
    const [season, kind] = c.label.split(' ');
    const el = document.createElement('button');
    el.className = 'set-tab' + (idx===activeCollectionIdx ? ' active' : '');
    el.innerHTML = `<span class="season">${season}</span>${kind}`;
    el.onclick = ()=>{
      if(activeCollectionIdx !== idx){
        activeCollectionIdx = idx;
        loadCollection();
      }
    };
    wrap.appendChild(el);
  });
}

function buildChips(){
  const row = document.getElementById('chipRow');
  const c = currentCollection();
  const chips = [{key:'all', label:'Alle'}, ...c.sections.map(s=>({key:s.key, label:s.label}))];
  row.innerHTML = '';
  chips.forEach(ch=>{
    const el = document.createElement('button');
    el.className = 'chip' + (activeSection===ch.key ? ' active' : '');
    el.textContent = ch.label;
    el.onclick = ()=>{ activeSection = ch.key; render(); };
    row.appendChild(el);
  });
}

function render(){
  buildSetTabs();
  buildChips();

  const c = currentCollection();
  const totalCards = c.sections.reduce((s, sec)=> s + sec.cards.length, 0);
  const collectedCount = Object.keys(collected).length;

  document.getElementById('totalCount').textContent = totalCards;
  document.getElementById('collectedCount').textContent = collectedCount;
  const pct = totalCards ? Math.round((collectedCount/totalCards)*100) : 0;
  document.getElementById('pctLabel').textContent = pct + '%';
  document.getElementById('barFill').style.width = pct + '%';

  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  const term = searchTerm.trim().toLowerCase();
  let anyResults = false;

  c.sections.forEach(section=>{
    if(activeSection !== 'all' && activeSection !== section.key) return;

    let cards = section.cards;
    if(term){
      cards = cards.filter(cd =>
        cd.name.toLowerCase().includes(term) ||
        cd.team.toLowerCase().includes(term) ||
        String(cd.num).includes(term)
      );
    }
    if(cards.length === 0) return;
    anyResults = true;

    const sectionCollected = section.cards.filter(cd => String(cd.num) in collected).length;

    const sec = document.createElement('div');
    sec.className = 'section';

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<h2>${section.label}</h2><span class="stat">${sectionCollected}/${section.cards.length}</span>`;
    sec.appendChild(head);

    const list = document.createElement('div');
    list.className = 'card-list';

    cards.forEach(cd=>{
      const key = String(cd.num);
      const isCollected = key in collected;
      const parallel = collected[key];
      const row = document.createElement('div');
      row.className = 'card-row' + (isCollected ? ' collected' : '');
      row.innerHTML = `
        <div class="box">${isCollected ? '✓' : ''}</div>
        <div class="num-badge">#${cd.num}</div>
        <div class="card-info">
          <div class="card-name">${cd.name}</div>
          <div class="card-team">${cd.team}</div>
          ${(isCollected && parallel) ? `<div class="parallel-tag">🏷 ${parallel}</div>` : ''}
        </div>
        ${isCollected ? `<div class="edit-tag-btn">🏷</div>` : ''}
      `;
      row.onclick = (e)=>{
        if(e.target.closest('.edit-tag-btn')){
          e.stopPropagation();
          editParallel(cd.num);
        }else{
          toggleCard(cd.num);
        }
      };
      list.appendChild(row);
    });

    sec.appendChild(list);
    main.appendChild(sec);
  });

  if(!anyResults){
    main.innerHTML = '<div class="empty">Keine Karten gefunden.</div>';
  }
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Wirklich diese Liste zurücksetzen?')){
    collected = {};
    saveCollection();
    render();
  }
});

document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  showToast('Aktualisiere …');
  await loadCollection();
  showToast('Aktualisiert ✓');
});

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const c = currentCollection();
  const pageWidth = 210;
  const marginLeft = 15;
  const marginRight = 15;
  const usableWidth = pageWidth - marginLeft - marginRight;
  const colWidth = usableWidth / 2;
  let y = 20;

  doc.setFontSize(16);
  doc.setFont(undefined, 'bold');
  doc.text('Panini Mosaic Basketball', marginLeft, y);
  y += 7;
  doc.setFontSize(12);
  doc.setFont(undefined, 'normal');
  doc.text(c.label + ' - Meine Sammlung', marginLeft, y);
  y += 5;

  const totalCards = c.sections.reduce((s, sec)=> s + sec.cards.length, 0);
  const collectedCount = Object.keys(collected).length;
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text(collectedCount + ' / ' + totalCards + ' Karten gesammelt', marginLeft, y);
  doc.setTextColor(0);
  y += 8;

  const lineHeight = 5.2;
  const pageBottom = 285;

  c.sections.forEach(section=>{
    if(y > pageBottom - 15){ doc.addPage(); y = 20; }
    doc.setFontSize(11);
    doc.setFont(undefined, 'bold');
    const secCollected = section.cards.filter(cd => String(cd.num) in collected).length;
    doc.text(section.label + '  (' + secCollected + '/' + section.cards.length + ')', marginLeft, y);
    y += 6;
    doc.setFont(undefined, 'normal');
    doc.setFontSize(9);

    let col = 0;
    let rowStartY = y;
    section.cards.forEach((cd, idx)=>{
      if(y > pageBottom){
        doc.addPage();
        y = 20;
        rowStartY = y;
        col = 0;
      }
      const x = marginLeft + col * colWidth;
      const key = String(cd.num);
      const isColl = key in collected;
      const mark = isColl ? '[x]' : '[ ]';
      const parallelSuffix = (isColl && collected[key]) ? ' (' + collected[key] + ')' : '';
      const text = mark + ' #' + cd.num + ' ' + cd.name + parallelSuffix;
      doc.text(text, x, y, { maxWidth: colWidth - 4 });
      if(col === 0){
        col = 1;
      }else{
        col = 0;
        y += lineHeight;
      }
    });
    if(col === 1) y += lineHeight;
    y += 4;
  });

  const filename = 'Mosaic_' + c.label.replace(/\s+/g,'_') + '_Sammlung.pdf';
  doc.save(filename);
}

document.getElementById('pdfBtn').addEventListener('click', exportPDF);

document.getElementById('syncStatus').textContent = firebaseReady
  ? '☁️ Synchronisiert über Geräte'
  : '📴 Nur lokal gespeichert (Firebase nicht eingerichtet)';

loadCollection();
</script>
